services:

  rundoo-db:
    image: gators/rundoo-db
    build:
      context: db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=uber
    networks:
      - rundoo-net

  rundooservice:
    image: rundooservice
    build:
      context: rundooservice
    ports:
      - "6000:6000"
    networks:
      - rundoo-net
    depends_on:
      - rundoo-db
      - logservice
      - registryservice

  logservice:
    image: logservice
    build:
      context: logservice
    ports:
      - "4000:4000"
    networks:
      - rundoo-net
    depends_on:
      - rundoo-db
      - registryservice
  
  registryservice:
    image: registryservice
    build:
      context: registryservice
    ports:
      - "3000:3000"
    networks:
      - rundoo-net
    depends_on:
      - rundoo-db
  
  portal:
    image: portal
    build:
      context: portal
    ports:
      - "5050:5050"
    networks:
      - rundoo-net
    depends_on:
      - rundoo-db
      - rundooservice      
      - registryservice
      - logservice

  tcpdump:
    image: nicolaka/netshoot
    command: ["tcpdump", "-v", "-i", "eth0"]
    networks:
      - rundoo-net
    cap_add:
      - NET_ADMIN

networks:
  rundoo-net: